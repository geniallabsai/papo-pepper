name: ci
on: [push, pull_request]

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instala o pacote (com extras de matemática)
        run: pip install -e ".[math]"
      - name: Roda a suíte completa
        run: python tests/run_all.py
